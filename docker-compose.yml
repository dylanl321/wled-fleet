# Local or same-machine compose. This file builds from the repo checkout.
# TrueNAS Custom App cannot see that checkout. Paste docker-compose.truenas.yml
# after ./scripts/publish pushes an image. Host networking hears WLED mDNS.

services:
  wled-fleet:
    image: ${WLED_FLEET_IMAGE:-wled-fleet:local}
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8787}
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-568}
      PGID: ${PGID:-568}
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SCAN_SUBNETS: ${SCAN_SUBNETS:-}
      EXTRA_HOSTS: ${EXTRA_HOSTS:-}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_WATCH_INTERVAL: ${BACKUP_WATCH_INTERVAL:-900}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-60}
      PRESENCE_INTERVAL: ${PRESENCE_INTERVAL:-20}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-48}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-1.2}
      WLED_GITHUB_REPO: ${WLED_GITHUB_REPO:-wled/WLED}
      QUINLED_GITHUB_REPO: ${QUINLED_GITHUB_REPO:-intermittech/QuinLED-Firmware}
      OTA_TIMEOUT: ${OTA_TIMEOUT:-180}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${DATA_PATH:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
